# Publica la APLICACIÓN WEB (carpeta web/) en GitHub Pages con cada push a "main".
# La API se publica aparte, en Render (ver render.yaml).
name: Publicar la web en GitHub Pages

on:
  push:
    branches: ['main']
    # La web usa también el motor (validación de RUC, nombres de estados)
    paths: ['web/**', 'motor/**', 'package-lock.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar la web (incluye la revisión de tipos)
        run: npm run build
        env:
          # Dirección de la API en Render: Settings > Secrets and variables > Actions > Variables
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Subir la carpeta compilada
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: './web/dist'
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

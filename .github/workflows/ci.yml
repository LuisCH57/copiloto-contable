# INTEGRACIÓN CONTINUA: en cada push revisa tipos, lint y ejecuta las pruebas.
# No necesita base de datos real: las pruebas usan PostgreSQL en memoria (PGlite).
name: Pruebas

on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Instalar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'npm'
      - name: Instalar dependencias (motor, api y web)
        run: npm ci
      - name: Revisar los tipos de TypeScript
        run: npm run typecheck
      - name: Revisar el código de la web (lint)
        run: npm run lint
      - name: Ejecutar las pruebas del motor y de la API
        run: npm test
